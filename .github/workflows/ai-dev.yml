name: AI 开发代理

# ============================================================
# GitHub Actions — AI 自动开发流水线
# ============================================================
#
# 触发条件：
#   1. Issue 被创建（标题即需求）
#   2. Issue 评论包含 "@ai" 关键字
#   3. 手动触发 workflow_dispatch（可输入自定义需求）
#
# 前置条件：
#   - 仓库 Settings → Secrets → Actions 中配置 ANTHROPIC_API_KEY
#   - 如果你想用 gh pr create，确保 Actions 有 write 权限
# ============================================================

on:
  # 触发 1：Issue 被打开
  issues:
    types: [opened]

  # 触发 2：Issue 评论包含 @ai
  issue_comment:
    types: [created]

  # 触发 3：手动触发
  workflow_dispatch:
    inputs:
      prompt:
        description: '需求描述（中文）'
        required: true
        default: '在 App.vue 中添加一个 footer 组件'

jobs:
  ai-dev:
    # 仅当评论包含 @ai 或 Issue 被打开或手动触发时才运行
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'issues' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@ai'))

    runs-on: ubuntu-latest

    permissions:
      contents: write       # 允许 push 代码
      pull-requests: write  # 允许创建 PR
      issues: read          # 允许读取 Issue

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: |
          npm install --no-audit --no-fund 2>/dev/null || true
          npm install @anthropic-ai/sdk 2>/dev/null || true

      - name: 配置 Git
        run: |
          git config user.name "AI Dev Bot"
          git config user.email "ai-dev-bot@github.com"

      - name: 运行 AI 开发代理
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
        run: node scripts/ai-dev.mjs
