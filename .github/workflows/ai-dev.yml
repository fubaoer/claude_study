name: AI 开发代理

# ============================================================
# GitHub Actions — Issue 触发 AI 自动开发
# ============================================================
#
# 使用方式：
#   1. 在 GitHub 创建 Issue，标题写需求 → 自动触发
#   2. 在 Issue 中评论 "@ai 帮我做XXX" → 自动触发
#   3. Actions 页面手动触发 workflow_dispatch
#
# 结果：AI 自动写代码 → 推送到新分支 → 创建 PR
#
# 前置条件：
#   GitHub Settings → Secrets → Actions → 添加 DEEPSEEK_API_KEY
# ============================================================

on:
  issues:
    types: [opened]

  issue_comment:
    types: [created]

  workflow_dispatch:
    inputs:
      prompt:
        description: '需求描述（中文）'
        required: true
        default: '在 App.vue 中添加一个 footer 组件'

jobs:
  ai-dev:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'issues' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@ai'))

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: read

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: |
          npm install --no-audit --no-fund 2>/dev/null || true
          npm install openai 2>/dev/null || true

      - name: 配置 Git
        run: |
          git config user.name "AI Dev Bot"
          git config user.email "ai-dev-bot@github.com"

      - name: 运行 AI 开发代理
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
        run: node scripts/ai-dev.mjs
